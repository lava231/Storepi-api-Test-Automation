$kind: http-request
method: POST
url: '{{baseUrl}}/users/current/cart'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "product_id": 1,
      "quantity": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Cart accepts the checkout product', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
