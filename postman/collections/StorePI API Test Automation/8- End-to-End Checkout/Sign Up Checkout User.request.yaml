$kind: http-request
method: POST
url: '{{baseUrl}}/signup'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "QA Student",
      "email": "{{checkout_email}}",
      "password": "{{checkout_password}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.variables.set('checkout_email', 'storepi_qa_' + pm.variables.replaceIn('{{$guid}}') + '@example.com');
      pm.variables.set('checkout_password', 'Qa1!' + pm.variables.replaceIn('{{$guid}}'));
      pm.variables.set('checkout_access_token', '');
      pm.variables.set('checkout_user_id', '');
      pm.variables.set('checkout_products', '');
      pm.variables.set('checkout_purchase_id', '');
  - type: afterResponse
    code: |-
      pm.test('Signup created the checkout account', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
          const user = pm.response.json().data?.user;
          pm.expect(user?.email).to.equal(pm.variables.get('checkout_email'));
          pm.expect(user.id, 'checkout user ID').to.be.a('string').and.not.empty;
          pm.variables.set('checkout_user_id', user.id);
      });
