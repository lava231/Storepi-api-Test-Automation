$kind: http-request
method: POST
url: '{{baseUrl}}/purchases'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "products": [
        { "product_id": 1, "quantity": 2 }
      ]
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('purchase_id', '');
  - type: afterResponse
    code: |-
      pm.test('Purchase creation returns a purchase ID', function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
          const purchases = pm.response.json().data;
          pm.expect(purchases, 'created purchases').to.be.an('array').with.lengthOf(1);
          const purchaseId = purchases[0].id;
          pm.expect(Number.isSafeInteger(purchaseId) && purchaseId > 0, 'positive purchase ID').to.equal(true);
          pm.environment.set('purchase_id', String(purchaseId));
      });
