$kind: http-request
method: GET
url: '{{baseUrl}}/users/current/wishlist'
order: 2000
scripts:
  - type: afterResponse
    code: |-
      pm.test('Product 3 persists in the current wishlist', function () {
          pm.response.to.have.status(200);
          const wishlists = pm.response.json().data;
          pm.expect(wishlists, 'wishlist response data').to.be.an('array');
          const products = wishlists[0]?.wishlist_products;
          pm.expect(products, 'wishlist_products').to.be.an('array');
          pm.expect(products.some(product => product.product_id === 3), 'product 3 is listed').to.equal(true);
      });
